<style>
  :root{
    --teal:#006188; --teal-d:#004a68; --gold:#B39E65; --gold-d:#9a854f;
    --ink:#1f2a30; --muted:#6a7780; --line:#e4e8eb; --bg:#f3f1ec; --card:#ffffff;
    --serif:"brandon-grotesque","Montserrat","Segoe UI",system-ui,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--serif); color:var(--ink); background:var(--bg);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  .app{display:flex;flex-direction:column;height:100dvh}
  /* header */
  header{
    display:flex;align-items:center;gap:16px;padding:12px 24px;
    background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto;z-index:5;
  }
  header img.logo{height:40px;width:auto;display:block}
  header .ttl{display:flex;flex-direction:column;line-height:1.05}
  header .ttl b{font-size:17px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink)}
  header .ttl span{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-d);font-weight:600}
  header .spacer{flex:1}
  .rugtag{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
  .rugtag .code{font-weight:600;color:var(--teal);letter-spacing:.08em}
  /* main split */
  .body{flex:1;display:flex;min-height:0}
  .stagewrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:22px;position:relative;background:
     radial-gradient(120% 90% at 50% 0%, #faf9f6 0%, var(--bg) 70%)}
  .stage{position:relative;width:100%;max-width:min(100%, calc((100dvh - 150px) * 1.488));
         aspect-ratio:1280/860;border-radius:16px;overflow:hidden;
         box-shadow:0 18px 50px -18px rgba(20,30,40,.35), 0 2px 0 rgba(255,255,255,.6) inset;
         background:#ddd;cursor:grab;touch-action:none}
  .stage.dragging{cursor:grabbing}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #roomCanvas{z-index:1}
  #glCanvas{z-index:2}
  .handles{position:absolute;inset:0;z-index:3;pointer-events:none}
  .handle{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
    background:rgba(255,255,255,.92);border:2px solid var(--teal);
    box-shadow:0 2px 8px rgba(0,0,0,.3);pointer-events:auto;cursor:grab;
    display:flex;align-items:center;justify-content:center;touch-action:none}
  .handle::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--teal)}
  .handle.rot{border-color:var(--gold);}
  .handle.rot::after{background:var(--gold)}
  .hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;z-index:4;pointer-events:none}
  .hint span{display:inline-block;background:rgba(20,30,40,.62);color:#fff;font-size:12px;
    padding:6px 14px;border-radius:999px;letter-spacing:.02em;backdrop-filter:blur(3px)}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;
    background:rgba(250,249,246,.75);backdrop-filter:blur(2px);font-size:13px;color:var(--muted);letter-spacing:.08em}
  .loading.hide{display:none}
  .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;
    animation:sp .8s linear infinite;margin-right:10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* panel */
  .panel{flex:0 0 322px;background:var(--card);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  .panel .scroll{overflow:auto;padding:20px 20px 8px}
  .sect{margin-bottom:22px}
  .sect h3{margin:0 0 10px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
  /* scene chips */
  .scenes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .scene{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;
    padding:0;position:relative;aspect-ratio:1.6;transition:border-color .15s, transform .1s}
  .scene:hover{transform:translateY(-1px)}
  .scene.sel{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,97,136,.12)}
  .scene img,.scene svg,.scene canvas{width:100%;height:100%;object-fit:cover;display:block}
  .scene .lbl{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.6));
    color:#fff;font-size:11px;letter-spacing:.06em;padding:12px 8px 6px;text-align:center}
  .scene.myroom{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--teal);
    border-style:dashed;border-color:var(--gold);background:#fcfbf7}
  .scene.myroom .ic{font-size:20px;line-height:1}
  .scene.myroom small{font-size:10.5px;letter-spacing:.08em;color:var(--gold-d);text-transform:uppercase;font-weight:700}
  .scene.myroom.hasimg{border-style:solid}
  /* size */
  .sizes{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12.5px;
    cursor:pointer;color:var(--ink);font-family:inherit;transition:all .12s}
  .chip:hover{border-color:var(--teal)}
  .chip.sel{background:var(--teal);border-color:var(--teal);color:#fff}
  .custom{display:flex;align-items:center;gap:8px;margin-top:12px}
  .custom input{width:56px;padding:8px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;
    font-size:13px;text-align:center}
  .custom input:focus{outline:none;border-color:var(--teal)}
  .custom span{color:var(--muted);font-size:13px}
  .custom .x{color:var(--gold-d);font-weight:700}
  /* controls */
  .row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .row label{font-size:12px;color:var(--muted);width:54px;flex:0 0 auto;letter-spacing:.04em}
  .row input[type=range]{flex:1;accent-color:var(--teal)}
  .btnrow{display:flex;gap:10px}
  button.act{flex:1;font-family:inherit;font-size:13px;letter-spacing:.06em;padding:11px;border-radius:11px;
    cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink);transition:all .12s}
  button.act:hover{border-color:var(--teal);color:var(--teal)}
  button.act.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  button.act.primary:hover{background:var(--teal-d);color:#fff}
  .panel .foot{border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;flex:0 0 auto;background:#fff}
  .note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:4px}
  .skurow{display:flex;gap:8px;margin-top:10px}
  .skurow input{flex:1;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  .skurow input:focus{outline:none;border-color:var(--teal)}
  .skurow button{padding:0 14px;border-radius:9px;border:1.5px solid var(--teal);background:var(--teal);color:#fff;font-family:inherit;font-size:12px;cursor:pointer;letter-spacing:.08em}
  .err{color:#b4443a;font-size:12px;margin-top:8px;display:none}
  .err.show{display:block}
  /* mobile */
  .mtab{display:none}
  @media (max-width:860px){
    body{overflow:auto}
    .app{height:auto;min-height:100dvh}
    .body{flex-direction:column}
    .panel{flex:none;width:100%;border-left:none;border-top:1px solid var(--line)}
    .stage{max-width:100%}
    .stagewrap{padding:14px}
    .panel .scroll{max-height:none}
  }
</style>
</head>
<body>

    <aside class="panel">

          <div class="scenes" id="scenes"></div>
        </div>

          <div class="sizes" id="sizes"></div>
          <div class="custom">
            <input id="szW" type="text" inputmode="decimal" value="8" aria-label="width feet" />
            <span class="x">×</span>

            <span>ft</span>
          </div>

        </div>

        <div class="sect" id="rotSect">
          <h3>Adjust</h3>
          <div class="row"><label>Rotate</label><input id="rot" type="range" min="-45" max="45" step="1" value="0" /></div>
          <div class="btnrow">
            <button class="act" id="resetBtn">Reset placement</button>
          </div>
        </div>

        <div class="sect">
          <h3>Try another design</h3>
          <div class="skurow">
            <input id="skuInput" placeholder="e.g. AM1002" />
            <button id="skuGo">Load</button>
          </div>
          <div class="err" id="skuErr"></div>
          <div class="note">Loads that design's photo live from kalaty.com — nothing is stored in this tool.</div>
        </div>
      </div>
      <div class="foot">
        <button class="act primary" id="dlBtn">Download image</button>
      </div>
    </aside>
  </div>

/* ---------- tiny linear algebra: 4-pt homography ---------- */
function solve(A,b){ // Gaussian elimination, A is n×n (row-major arrays), b length n
  const n=b.length;
  for(let i=0;i<n;i++){
    let p=i; for(let r=i+1;r<n;r++) if(Math.abs(A[r][i])>Math.abs(A[p][i])) p=r;
    [A[i],A[p]]=[A[p],A[i]]; [b[i],b[p]]=[b[p],b[i]];
    const d=A[i][i];
    for(let c=i;c<n;c++) A[i][c]/=d; b[i]/=d;
    for(let r=0;r<n;r++){ if(r===i) continue; const f=A[r][i];
      for(let c=i;c<n;c++) A[r][c]-=f*A[i][c]; b[r]-=f*b[i]; }
  }
  return b;
}
// maps src[4] -> dst[4], returns 3x3 (row-major 9)
function homography(src,dst){
  const A=[],b=[];
  for(let i=0;i<4;i++){
    const [x,y]=src[i], [X,Y]=dst[i];
    A.push([x,y,1,0,0,0,-X*x,-X*y]); b.push(X);
    A.push([0,0,0,x,y,1,-Y*x,-Y*y]); b.push(Y);
  }
  const h=solve(A,b);
  return [h[0],h[1],h[2], h[3],h[4],h[5], h[6],h[7],1];
}
function matInv3(m){
  const [a,b,c,d,e,f,g,h,i]=m;
  const A=e*i-f*h, B=-(d*i-f*g), C=d*h-e*g;
  const det=a*A+b*B+c*C; const id=1/det;
  return [
    A*id, (c*h-b*i)*id, (b*f-c*e)*id,
    B*id, (a*i-c*g)*id, (c*d-a*f)*id,
    C*id, (b*g-a*h)*id, (a*e-b*d)*id
  ];
}
function apply3(m,x,y){ const w=m[6]*x+m[7]*y+m[8]; return [(m[0]*x+m[1]*y+m[2])/w,(m[3]*x+m[4]*y+m[5])/w]; }

/* ---------- scenes (illustrated rooms + floor homographies) ----------
   floorPts: image-space points for floor rectangle corners
             (0,0)=back-left, (W,0)=back-right, (W,D)=front-right, (0,D)=front-left  */
const NAT_W=1280, NAT_H=860;
function roomSVG(parts){
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(
   `<svg xmlns="http://www.w3.org/2000/svg" width="${NAT_W}" height="${NAT_H}" viewBox="0 0 ${NAT_W} ${NAT_H}">`+parts+`</svg>`);
}
function planks(quad, n, color, line){
  // quad: [bl, br, fr, fl] in image space (floor rect corners) -> perspective planks
  const [bl,br,fr,fl]=quad; let s='';
  for(let i=0;i<=n;i++){ const t=i/n;
    const a=[bl[0]+(fl[0]-bl[0])*t, bl[1]+(fl[1]-bl[1])*t];
    const b=[br[0]+(fr[0]-br[0])*t, br[1]+(fr[1]-br[1])*t];
    s+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${line}" stroke-width="${(1+t*1.6).toFixed(2)}" opacity="${(0.25+t*0.35).toFixed(2)}"/>`;
  }
  // a few lengthwise seams
  for(let j=1;j<6;j++){ const t=j/6;
    const a=[bl[0]+(br[0]-bl[0])*t, bl[1]+(br[1]-bl[1])*t];
    const b=[fl[0]+(fr[0]-fl[0])*t, fl[1]+(fr[1]-fl[1])*t];
    s+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${line}" stroke-width="1" opacity="0.14"/>`;
  }
  return s;
}

      <rect x="760" y="402" width="120" height="70" rx="14" fill="#c9b28a"/>
      </g>`;
    const plant=`<g>
      <rect x="1050" y="360" width="86" height="120" rx="8" fill="#bfae8f"/>
      <path d="M1093 360 C1060 300 1050 250 1072 210 C1086 250 1092 300 1095 360Z" fill="#6f8f6a"/>
      <path d="M1093 360 C1120 300 1150 270 1160 230 C1140 280 1120 330 1101 360Z" fill="#7d9c74"/>
      <path d="M1093 362 C1070 320 1030 300 1010 280 C1045 310 1075 340 1090 362Z" fill="#608060"/>
      </g>`;
    const lamp=`<g><rect x="250" y="330" width="10" height="190" fill="#8c7a5c"/>
      <path d="M232 330 L278 330 L270 290 L240 290 Z" fill="#e9dcc2"/></g>`;
    return { label:'Living Room', floorPts:fq, floorFt:[16,13],
      bg: roomSVG(defs+wall+art+window+floor+lamp+plant+sofa) };
  })(),
  bedroom: (()=>{
    const fq=[[120,500],[1160,500],[1275,840],[5,840]];
    const defs=`<defs>

      <linearGradient id="bf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c7ad"/><stop offset="1" stop-color="#c4a883"/></linearGradient>
      <linearGradient id="bh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b7f93"/><stop offset="1" stop-color="#58697b"/></linearGradient>
    </defs>`;
    const wall=`<rect x="0" y="0" width="1280" height="502" fill="url(#bw)"/><rect x="0" y="492" width="1280" height="12" fill="#cdc1cf"/>`;
    const floor=`<rect x="0" y="500" width="1280" height="360" fill="url(#bf)"/>`+planks(fq,12,'','#8a6f4c');
    const bed=`<g>
      <ellipse cx="640" cy="560" rx="360" ry="36" fill="#000" opacity="0.08"/>
      <rect x="360" y="250" width="560" height="170" rx="18" fill="url(#bh)"/>
      <rect x="330" y="400" width="620" height="150" rx="16" fill="#f3efe9"/>
      <rect x="330" y="360" width="620" height="70" rx="16" fill="#fbf9f5"/>
      <rect x="360" y="372" width="150" height="70" rx="12" fill="#fff"/>
      <rect x="770" y="372" width="150" height="70" rx="12" fill="#fff"/>
      <rect x="430" y="430" width="420" height="120" rx="12" fill="#e7ddcf"/>
      </g>`;
    const stands=`<g>
      <rect x="210" y="430" width="120" height="120" rx="10" fill="#b79a74"/>
      <rect x="950" y="430" width="120" height="120" rx="10" fill="#b79a74"/>
      <g><rect x="255" y="360" width="10" height="70" fill="#9a8460"/><path d="M238 360 L292 360 L284 320 L246 320Z" fill="#efe6cf"/></g>
      <g><rect x="1005" y="360" width="10" height="70" fill="#9a8460"/><path d="M988 360 L1042 360 L1034 320 L996 320Z" fill="#efe6cf"/></g>
      </g>`;
    const win=`<rect x="520" y="90" width="240" height="150" rx="4" fill="#fff"/><rect x="532" y="102" width="216" height="126" fill="#dbe7ec"/><rect x="636" y="102" width="8" height="126" fill="#fff"/>`;
    return { label:'Bedroom', floorPts:fq, floorFt:[15,12], bg: roomSVG(defs+wall+win+floor+stands+bed) };
  })(),
};

/* ---------- state ---------- */
const S = {
  sceneKey:'living', mode:'floor',
  rug:{img:null, crop:[0,0,1,1], aspect:0.79, code:'—'},
  myRoomURL:null,
  wft:8, lft:10, rotDeg:0,
  cx:8, cy:7,                 // floor position in feet (floor mode)
  corners:null,              // image-space 4 corners (myroom mode)
};

/* ---------- WebGL ---------- */
const gl = document.getElementById('glCanvas').getContext('webgl',{premultipliedAlpha:false,preserveDrawingBuffer:true,antialias:true});
const VS=`attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}`;
const FS_RUG=`precision highp float;uniform mat3 uInv;uniform vec2 uRes;uniform sampler2D uT;uniform vec4 uCrop;uniform float uF;
void main(){vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);vec3 h=uInv*vec3(p,1.0);vec2 uv=h.xy/h.z;
 if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0)discard;
 float a=smoothstep(0.0,uF,uv.x)*smoothstep(0.0,uF,1.0-uv.x)*smoothstep(0.0,uF,uv.y)*smoothstep(0.0,uF,1.0-uv.y);
 vec2 tc=mix(uCrop.xy,uCrop.zw,uv);vec4 c=texture2D(uT,tc);gl_FragColor=vec4(c.rgb,c.a*a);}`;
const FS_SHA=`precision highp float;uniform mat3 uInv;uniform vec2 uRes;uniform float uF;uniform float uA;
void main(){vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);vec3 h=uInv*vec3(p,1.0);vec2 uv=h.xy/h.z;
 float m=smoothstep(-uF,uF,uv.x)*smoothstep(-uF,uF,1.0-uv.x)*smoothstep(-uF,uF,uv.y)*smoothstep(-uF,uF,1.0-uv.y);
 gl_FragColor=vec4(0.0,0.0,0.0,m*uA);}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s;}
function prog(fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw gl.getProgramInfoLog(p);return p;}
const pRug=prog(FS_RUG), pSha=prog(FS_SHA);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
let rugTex=null;
function uploadRugTex(img){ if(rugTex)gl.deleteTexture(rugTex); rugTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,rugTex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);}

/* ---------- compute current rug quad (image space) ---------- */
function currentQuad(){
  if(S.mode==='myroom' && S.corners) return S.corners.map(p=>p.slice());
  const sc=SCENES[S.sceneKey]; const [FW,FD]=sc.floorFt;
  const H=homography([[0,0],[FW,0],[FW,FD],[0,FD]], sc.floorPts);
  const w=S.wft, l=S.lft, th=S.rotDeg*Math.PI/180, co=Math.cos(th), si=Math.sin(th);
  const loc=[[-w/2,-l/2],[w/2,-l/2],[w/2,l/2],[-w/2,l/2]];
  return loc.map(([x,y])=>{ const fx=S.cx+x*co-y*si, fy=S.cy+x*si+y*co; return apply3(H,fx,fy); });
}
function expandQuad(q,f,dy){ const cx=(q[0][0]+q[1][0]+q[2][0]+q[3][0])/4, cy=(q[0][1]+q[1][1]+q[2][1]+q[3][1])/4;
  return q.map(p=>[cx+(p[0]-cx)*f, cy+(p[1]-cy)*f+dy]); }

/* ---------- render ---------- */
const UV=[[0,0],[1,0],[1,1],[0,1]];
function drawPass(p,quad,setU){
  gl.useProgram(p);
  const H=homography(UV,quad); const inv=matInv3(H);
  const loc=gl.getAttribLocation(p,'a');gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  // mat3 uniform column-major
  gl.uniformMatrix3fv(gl.getUniformLocation(p,'uInv'),false,new Float32Array([inv[0],inv[3],inv[6],inv[1],inv[4],inv[7],inv[2],inv[5],inv[8]]));
  gl.uniform2f(gl.getUniformLocation(p,'uRes'),NAT_W,NAT_H);
  setU(p);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function render(){
  gl.viewport(0,0,NAT_W,NAT_H);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  if(!rugTex)return;
  const quad=currentQuad();
  // shadow (expanded, nudged toward front/below)
  drawPass(pSha, expandQuad(quad,1.045,14), (p)=>{gl.uniform1f(gl.getUniformLocation(p,'uF'),0.16);gl.uniform1f(gl.getUniformLocation(p,'uA'),0.30);});
  // rug
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,rugTex);
  drawPass(pRug, quad, (p)=>{gl.uniform1i(gl.getUniformLocation(p,'uT'),0);
    gl.uniform4f(gl.getUniformLocation(p,'uCrop'),S.rug.crop[0],S.rug.crop[1],S.rug.crop[2],S.rug.crop[3]);
    gl.uniform1f(gl.getUniformLocation(p,'uF'),0.012);});
  placeHandles(quad);
}

/* ---------- room background canvas ---------- */
const rc=document.getElementById('roomCanvas'), rctx=rc.getContext('2d');
let roomImg=null;
function drawRoom(){
  rctx.clearRect(0,0,NAT_W,NAT_H);
  if(S.mode==='myroom' && S.myRoomURL && roomImg){ coverDraw(roomImg); }
  else if(roomImg){ rctx.drawImage(roomImg,0,0,NAT_W,NAT_H); }
}
function coverDraw(img){ const ir=img.width/img.height, cr=NAT_W/NAT_H; let w,h,x,y;
  if(ir>cr){ h=NAT_H; w=h*ir; } else { w=NAT_W; h=w/ir; } x=(NAT_W-w)/2; y=(NAT_H-h)/2; rctx.drawImage(img,x,y,w,h); }
function loadRoom(key){
  return new Promise(res=>{ const sc=SCENES[key]; const im=new Image(); im.onload=()=>{roomImg=im;drawRoom();res();}; im.src=sc.bg; });
}

/* ---------- rug loading + auto-crop ---------- */
function autoCrop(img){
  const w=220, h=Math.round(w*img.height/img.width); const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(img,0,0,w,h);
  let d; try{ d=x.getImageData(0,0,w,h).data; }catch(e){ return [0,0,1,1]; } // tainted -> no crop
  const isRug=(i)=>{ const r=d[i],g=d[i+1],b=d[i+2]; const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
    return !(r>236&&g>236&&b>236&&(mx-mn)<16); };
  let minX=w,minY=h,maxX=0,maxY=0;
  const need=Math.max(2,Math.round(w*0.02));
  for(let yy=0;yy<h;yy++){ let cnt=0; for(let xx=0;xx<w;xx++){ if(isRug((yy*w+xx)*4)){cnt++; if(xx<minX)minX=xx; if(xx>maxX)maxX=xx;} }
    if(cnt>=need){ if(yy<minY)minY=yy; if(yy>maxY)maxY=yy; } }
  if(maxX<=minX||maxY<=minY) return [0,0,1,1];
  const pad=1; minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(w-1,maxX+pad);maxY=Math.min(h-1,maxY+pad);
  return [minX/w, minY/h, (maxX+1)/w, (maxY+1)/h];
}
function loadImage(src,cross){ return new Promise((res,rej)=>{ const im=new Image(); if(cross)im.crossOrigin='anonymous';
  im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }

async function setRugFromImage(img, code){
  S.rug.img=img; S.rug.code=code; S.rug.crop=autoCrop(img);
  const cw=S.rug.crop[2]-S.rug.crop[0], ch=S.rug.crop[3]-S.rug.crop[1];
  S.rug.aspect=(img.width*cw)/(img.height*ch);
  uploadRugTex(img);
  document.getElementById('rugCode').textContent=code;
  render();
}
function showLoading(on,txt){ const l=document.getElementById('loading'); l.classList.toggle('hide',!on); if(txt)l.lastChild.textContent=txt; }

async function loadSku(sku){
  sku=(sku||'').trim().toUpperCase(); if(!sku) return;
  const err=document.getElementById('skuErr'); err.classList.remove('show');
  showLoading(true,'Loading '+sku+'…');
  try{
    const r=await fetch(CONFIG.searchApi(sku)); const j=await r.json();
    const hit=(j.data||[]).find(d=>d.type==='product') || (j.data||[])[0];
    if(!hit||!hit.image) throw new Error('not found');
    let img;
    try{ img=await loadImage(CONFIG.proxy(hit.image),true); }
    catch(e){ img=await loadImage(hit.image,true); } // same-origin / CORS-enabled case
    await setRugFromImage(img, hit.name||sku);
    showLoading(false);
    return true;
  }catch(e){
    showLoading(false);
    err.textContent='Could not load "'+sku+'". Check the design number and try again.';
    err.classList.add('show');
    return false;
  }
}

/* ---------- handles / interaction ---------- */
const stage=document.getElementById('stage'), handlesEl=document.getElementById('handles');
function toNat(ev){ const r=stage.getBoundingClientRect(); const x=(ev.clientX-r.left)/r.width*NAT_W, y=(ev.clientY-r.top)/r.height*NAT_H; return [x,y]; }
function placeHandles(quad){
  handlesEl.innerHTML='';
  if(S.mode==='myroom'){
    quad.forEach((p,i)=>addHandle(p[0],p[1],'corner'+i));
  } else {
    // rotate handle above the rug's back edge midpoint
    const mid=[(quad[0][0]+quad[1][0])/2,(quad[0][1]+quad[1][1])/2];
    const cen=[(quad[0][0]+quad[2][0])/2,(quad[0][1]+quad[2][1])/2];
    const dir=[mid[0]-cen[0],mid[1]-cen[1]]; const len=Math.hypot(dir[0],dir[1])||1;
    addHandle(mid[0]+dir[0]/len*34, mid[1]+dir[1]/len*34, 'rot', true);
  }
}
function addHandle(x,y,id,isRot){ const h=document.createElement('div'); h.className='handle'+(isRot?' rot':'');
  h.style.left=(x/NAT_W*100)+'%'; h.style.top=(y/NAT_H*100)+'%'; h.dataset.id=id; handlesEl.appendChild(h); return h; }

let drag=null;
function pointInQuad(px,py,q){ let s=false;
  for(let i=0,j=3;i<4;j=i++){ const xi=q[i][0],yi=q[i][1],xj=q[j][0],yj=q[j][1];
    if(((yi>py)!==(yj>py)) && (px<(xj-xi)*(py-yi)/(yj-yi)+xi)) s=!s; } return s; }
stage.addEventListener('pointerdown',(ev)=>{
  const hid=ev.target.dataset && ev.target.dataset.id;
  const [nx,ny]=toNat(ev); stage.setPointerCapture(ev.pointerId);
  if(hid && hid.startsWith('corner')){ drag={type:'corner',idx:+hid.slice(6)}; }
  else if(hid==='rot'){ drag={type:'rot'}; }
  else {
    const q=currentQuad();
    if(pointInQuad(nx,ny,q)){ drag={type:'move', sx:nx, sy:ny}; stage.classList.add('dragging'); }
    else return;
  }
  ev.preventDefault();
});
stage.addEventListener('pointermove',(ev)=>{
  if(!drag) return; const [nx,ny]=toNat(ev);
  if(S.mode==='myroom'){
    const q=S.corners;
    if(drag.type==='corner'){ q[drag.idx]=[clamp(nx,0,NAT_W),clamp(ny,0,NAT_H)]; }
    else if(drag.type==='move'){ const dx=nx-drag.sx, dy=ny-drag.sy; drag.sx=nx;drag.sy=ny; q.forEach(p=>{p[0]+=dx;p[1]+=dy;}); }
    render();
  } else {
    const sc=SCENES[S.sceneKey]; const [FW,FD]=sc.floorFt;
    const Hf=homography([[0,0],[FW,0],[FW,FD],[0,FD]], sc.floorPts); const inv=matInv3(Hf);
    const f=apply3(inv,nx,ny);
    if(drag.type==='move'){ S.cx=clamp(f[0],-2,FW+2); S.cy=clamp(f[1],-2,FD+2); }
    else if(drag.type==='rot'){ const d=Math.atan2(f[1]-S.cy, f[0]-S.cx); S.rotDeg=clamp((d*180/Math.PI)+90,-80,80); document.getElementById('rot').value=Math.round(S.rotDeg); }
    render();
  }
});
function endDrag(ev){ if(drag){drag=null;stage.classList.remove('dragging'); try{stage.releasePointerCapture(ev.pointerId)}catch(e){}} }
stage.addEventListener('pointerup',endDrag); stage.addEventListener('pointercancel',endDrag);
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ---------- UI wiring ---------- */
function buildScenes(){
  const el=document.getElementById('scenes'); el.innerHTML='';
  Object.keys(SCENES).forEach(k=>{ const sc=SCENES[k];
    const d=document.createElement('div'); d.className='scene'+(S.sceneKey===k&&S.mode==='floor'?' sel':'');
    d.innerHTML=`<img src="${sc.bg}" alt="${sc.label}"/><div class="lbl">${sc.label}</div>`;
    d.onclick=()=>selectScene(k); el.appendChild(d);
  });
  // My Room
  const m=document.createElement('div'); m.className='scene myroom'+(S.mode==='myroom'?' sel hasimg':'');
  m.innerHTML = S.myRoomURL
     ? `<img src="${S.myRoomURL}" alt="My Room"/><div class="lbl">My Room</div>`
     : `<div class="ic">⬆</div><small>My Room</small>`;
  m.onclick=()=>document.getElementById('fileIn').click(); el.appendChild(m);
}
async function selectScene(k){
  S.sceneKey=k; S.mode='floor'; S.rotDeg=0; document.getElementById('rot').value=0;
  const sc=SCENES[k]; S.cx=sc.floorFt[0]/2; S.cy=sc.floorFt[1]*0.55;
  await loadRoom(k); document.getElementById('rotSect').style.display='';
  document.getElementById('hint').firstChild.textContent='Drag the rug to move it on the floor';
  buildScenes(); render();
}
async function useMyRoom(url){
  S.myRoomURL=url; S.mode='myroom';
  roomImg=await loadImage(url,false); drawRoom();
  // default corners: a centered trapezoid on the lower half
  S.corners=[[NAT_W*0.34,NAT_H*0.52],[NAT_W*0.66,NAT_H*0.52],[NAT_W*0.80,NAT_H*0.82],[NAT_W*0.20,NAT_H*0.82]];
  document.getElementById('rotSect').style.display='none';
  document.getElementById('hint').firstChild.textContent='Drag the 4 dots onto your floor';
  buildScenes(); render();
}
document.getElementById('fileIn')?.remove();
const fileIn=document.createElement('input'); fileIn.type='file'; fileIn.accept='image/*'; fileIn.id='fileIn'; fileIn.style.display='none';
fileIn.onchange=(e)=>{ const f=e.target.files[0]; if(!f)return; const u=URL.createObjectURL(f); useMyRoom(u); };
document.body.appendChild(fileIn);

const SIZES=[['8×10',8,10],['9×12',9,12],['6×9',6,9],['5×8',5,8],['4×6',4,6],['2×8 Rnr',2.5,8]];
function buildSizes(){ const el=document.getElementById('sizes'); el.innerHTML='';
  SIZES.forEach(([lbl,w,l])=>{ const b=document.createElement('button'); b.className='chip'+(S.wft===w&&S.lft===l?' sel':'');
    b.textContent=lbl; b.onclick=()=>{ S.wft=w;S.lft=l; document.getElementById('szW').value=w;document.getElementById('szL').value=l; buildSizes(); render(); }; el.appendChild(b); }); }
document.getElementById('szW').addEventListener('input',e=>{ const v=parseFloat(e.target.value); if(v>0){S.wft=v;buildSizes();render();} });
document.getElementById('szL').addEventListener('input',e=>{ const v=parseFloat(e.target.value); if(v>0){S.lft=v;buildSizes();render();} });
document.getElementById('rot').addEventListener('input',e=>{ S.rotDeg=+e.target.value; render(); });
document.getElementById('resetBtn').onclick=()=>{ if(S.mode==='myroom'){ useMyRoom(S.myRoomURL); } else { selectScene(S.sceneKey); } };
document.getElementById('skuGo').onclick=()=>loadSku(document.getElementById('skuInput').value);
document.getElementById('skuInput').addEventListener('keydown',e=>{ if(e.key==='Enter')loadSku(e.target.value); });

/* ---------- download ---------- */
document.getElementById('dlBtn').onclick=()=>{
  const out=document.createElement('canvas'); out.width=NAT_W; out.height=NAT_H; const o=out.getContext('2d');
  o.drawImage(rc,0,0); o.drawImage(document.getElementById('glCanvas'),0,0);
  let url; try{ url=out.toDataURL('image/jpeg',0.92); }
  catch(e){ alert('Download is blocked because the rug image was served without cross-origin permission. On kalaty.com (same-origin) this works normally.'); return; }
  const a=document.createElement('a'); a.href=url; a.download='Kalaty-'+S.rug.code+'-RoomView.jpg'; a.click();
};

/* ---------- boot ---------- */
async function boot(){
  buildSizes(); buildScenes();
  await selectScene('living');
  const params=new URLSearchParams(location.search);
  const sku=(params.get('sku')||params.get('design')||CONFIG.defaultSku).toUpperCase();
  document.getElementById('skuInput').value=sku;
  const ok=await loadSku(sku);
  if(!ok && sku===CONFIG.defaultSku){
    showLoading(true,'Loading demo rug…');
    try{ const img=await loadImage(FALLBACK_AF1284,false); await setRugFromImage(img,'AF1284'); }catch(e){}
    showLoading(false);
    document.getElementById('skuErr').classList.remove('show');
  }
}
boot();
</script>
