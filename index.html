<style>
  :root{--teal:#006188;--teal-d:#004a68;--gold:#B39E65;--gold-d:#9a854f;--ink:#1f2a30;--muted:#6a7780;--line:#e4e8eb;--bg:#f3f1ec;--card:#fff;--serif:"brandon-grotesque","Montserrat","Segoe UI",system-ui,Arial,sans-serif;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font-family:var(--serif);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100dvh}
  header{display:flex;align-items:center;gap:16px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto;z-index:5}
  header img.logo{height:40px;width:auto;display:block}
  header .ttl{display:flex;flex-direction:column;line-height:1.05}
  header .ttl b{font-size:17px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  header .ttl span{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-d);font-weight:600}
  header .spacer{flex:1}
  .rugtag{font-size:12.5px;color:var(--muted)}.rugtag .code{font-weight:600;color:var(--teal);letter-spacing:.08em}
  .body{flex:1;display:flex;min-height:0}
  .stagewrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:22px;position:relative;background:radial-gradient(120% 90% at 50% 0%,#faf9f6,var(--bg) 70%)}
  .stage{position:relative;width:100%;border-radius:16px;overflow:hidden;box-shadow:0 18px 50px -18px rgba(20,30,40,.35);background:#ddd;cursor:grab;touch-action:none}
  .stage.dragging{cursor:grabbing}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #roomCanvas{z-index:1}#glCanvas{z-index:2}
  .handles{position:absolute;inset:0;z-index:3;pointer-events:none}
  .handle{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(255,255,255,.92);border:2px solid var(--teal);box-shadow:0 2px 8px rgba(0,0,0,.3);pointer-events:auto;cursor:grab;touch-action:none}
  .handle::after{content:"";position:absolute;inset:0;margin:auto;width:7px;height:7px;border-radius:50%;background:var(--teal)}
  .handle.rot{border-color:var(--gold)}.handle.rot::after{background:var(--gold)}
  .hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;z-index:4;pointer-events:none}
  .hint span{display:inline-block;background:rgba(20,30,40,.62);color:#fff;font-size:12px;padding:6px 14px;border-radius:999px;backdrop-filter:blur(3px)}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;background:rgba(250,249,246,.75);backdrop-filter:blur(2px);font-size:13px;color:var(--muted);letter-spacing:.08em}
  .loading.hide{display:none}
  .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite;margin-right:10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .panel{flex:0 0 322px;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .panel .scroll{overflow:auto;padding:20px 20px 8px}
  .sect{margin-bottom:22px}
  .sect h3{margin:0 0 10px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .scenes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .scene{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;position:relative;aspect-ratio:1.5;transition:border-color .15s,transform .1s}
  .scene:hover{transform:translateY(-1px)}
  .scene.sel{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,97,136,.12)}
  .scene img{width:100%;height:100%;object-fit:cover;display:block}
  .scene .lbl{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:11px;padding:12px 8px 6px;text-align:center}
  .scene.myroom{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--teal);border-style:dashed;border-color:var(--gold);background:#fcfbf7}
  .scene.myroom .ic{font-size:20px}.scene.myroom small{font-size:10.5px;letter-spacing:.08em;color:var(--gold-d);text-transform:uppercase;font-weight:700}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .row label{font-size:12px;color:var(--muted);width:54px;flex:0 0 auto}
  .row input[type=range]{flex:1;accent-color:var(--teal)}
  button.act{width:100%;font-family:inherit;font-size:13px;letter-spacing:.06em;padding:11px;border-radius:11px;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink);transition:all .12s}
  button.act:hover{border-color:var(--teal);color:var(--teal)}
  .panel .foot{border-top:1px solid var(--line);padding:14px 20px;flex:0 0 auto;background:#fff}
  button.primary{width:100%;font-family:inherit;font-size:13px;letter-spacing:.06em;padding:12px;border-radius:11px;cursor:pointer;border:1.5px solid var(--teal);background:var(--teal);color:#fff}
  button.primary:hover{background:var(--teal-d)}
  .note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:4px}
  .skurow{display:flex;gap:8px;margin-top:10px}
  .skurow input{flex:1;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  .skurow input:focus{outline:none;border-color:var(--teal)}
  .skurow button{padding:0 14px;border-radius:9px;border:1.5px solid var(--teal);background:var(--teal);color:#fff;font-family:inherit;font-size:12px;cursor:pointer}
  .err{color:#b4443a;font-size:12px;margin-top:8px;display:none}.err.show{display:block}
  @media (max-width:860px){body{overflow:auto}.app{height:auto;min-height:100dvh}.body{flex-direction:column}.panel{flex:none;width:100%;border-left:none;border-top:1px solid var(--line)}}
</style>
</head>

function solve(A,b){const n=b.length;for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;[A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];const d=A[i][i];for(let c=i;c<n;c++)A[i][c]/=d;b[i]/=d;for(let r=0;r<n;r++){if(r===i)continue;const f=A[r][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i];}}return b;}
function homography(src,dst){const A=[],b=[];for(let i=0;i<4;i++){const[x,y]=src[i],[X,Y]=dst[i];A.push([x,y,1,0,0,0,-X*x,-X*y]);b.push(X);A.push([0,0,0,x,y,1,-Y*x,-Y*y]);b.push(Y);}const h=solve(A,b);return[h[0],h[1],h[2],h[3],h[4],h[5],h[6],h[7],1];}
function matInv3(m){const[a,b,c,d,e,f,g,h,i]=m;const A=e*i-f*h,B=-(d*i-f*g),C=d*h-e*g;const det=a*A+b*B+c*C,id=1/det;return[A*id,(c*h-b*i)*id,(b*f-c*e)*id,B*id,(a*i-c*g)*id,(c*d-a*f)*id,C*id,(b*g-a*h)*id,(a*e-b*d)*id];}

const S={sceneKey:'aa895',mode:'photo',rug:{img:null,crop:[0,0,1,1],code:'—'},myRoomURL:null,rotDeg:0,dx:0,dy:0,corners:null};

/* ---- WebGL ---- */
const gl=document.getElementById('glCanvas').getContext('webgl',{premultipliedAlpha:false,preserveDrawingBuffer:true,antialias:true});
const VS=`attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}`;
const FS_RUG=`precision highp float;uniform mat3 uInv;uniform vec2 uRes;uniform sampler2D uT;uniform vec4 uCrop;uniform float uF;
void main(){vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);vec3 h=uInv*vec3(p,1.0);vec2 uv=h.xy/h.z;
 if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0)discard;
 float a=smoothstep(0.0,uF,uv.x)*smoothstep(0.0,uF,1.0-uv.x)*smoothstep(0.0,uF,uv.y)*smoothstep(0.0,uF,1.0-uv.y);
 vec2 tc=mix(uCrop.xy,uCrop.zw,uv);vec4 c=texture2D(uT,tc);gl_FragColor=vec4(c.rgb,c.a*a);}`;
const FS_SHA=`precision highp float;uniform mat3 uInv;uniform vec2 uRes;uniform float uF;uniform float uA;
void main(){vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);vec3 h=uInv*vec3(p,1.0);vec2 uv=h.xy/h.z;
 float m=smoothstep(-uF,uF,uv.x)*smoothstep(-uF,uF,1.0-uv.x)*smoothstep(-uF,uF,uv.y)*smoothstep(-uF,uF,1.0-uv.y);
 gl_FragColor=vec4(0.0,0.0,0.0,m*uA);}`;
function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s;}
function prog(fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);return p;}
const pRug=prog(FS_RUG),pSha=prog(FS_SHA);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
let rugTex=null;
function uploadRugTex(img){if(rugTex)gl.deleteTexture(rugTex);rugTex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,rugTex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);}

function centroid(q){return[(q[0][0]+q[1][0]+q[2][0]+q[3][0])/4,(q[0][1]+q[1][1]+q[2][1]+q[3][1])/4];}
function currentQuad(){
  if(S.mode==='myroom'&&S.corners)return S.corners.map(p=>p.slice());
  const base=SCENES[S.sceneKey].rugQuad, c=centroid(base), th=S.rotDeg*Math.PI/180, co=Math.cos(th), si=Math.sin(th);
  return base.map(p=>{const x=p[0]-c[0],y=p[1]-c[1];return[c[0]+x*co-y*si+S.dx, c[1]+x*si+y*co+S.dy];});
}
function expandQuad(q,f,dy){const c=centroid(q);return q.map(p=>[c[0]+(p[0]-c[0])*f,c[1]+(p[1]-c[1])*f+dy]);}
const UV=[[0,0],[1,0],[1,1],[0,1]];
function drawPass(p,quad,setU){gl.useProgram(p);const H=homography(UV,quad),inv=matInv3(H);const loc=gl.getAttribLocation(p,'a');gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);gl.uniformMatrix3fv(gl.getUniformLocation(p,'uInv'),false,new Float32Array([inv[0],inv[3],inv[6],inv[1],inv[4],inv[7],inv[2],inv[5],inv[8]]));gl.uniform2f(gl.getUniformLocation(p,'uRes'),SW,SH);setU(p);gl.drawArrays(gl.TRIANGLES,0,3);}
function render(){
  gl.viewport(0,0,SW,SH);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  if(!rugTex)return;const quad=currentQuad();
  drawPass(pSha,expandQuad(quad,1.03,Math.max(6,SH*0.012)),p=>{gl.uniform1f(gl.getUniformLocation(p,'uF'),0.14);gl.uniform1f(gl.getUniformLocation(p,'uA'),0.22);});
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,rugTex);
  drawPass(pRug,quad,p=>{gl.uniform1i(gl.getUniformLocation(p,'uT'),0);gl.uniform4f(gl.getUniformLocation(p,'uCrop'),S.rug.crop[0],S.rug.crop[1],S.rug.crop[2],S.rug.crop[3]);gl.uniform1f(gl.getUniformLocation(p,'uF'),0.008);});
  placeHandles(quad);
}

/* ---- room bg ---- */
const rc=document.getElementById('roomCanvas'),rctx=rc.getContext('2d');let roomImg=null;
function setSize(w,h){SW=w;SH=h;rc.width=w;rc.height=h;document.getElementById('glCanvas').width=w;document.getElementById('glCanvas').height=h;
  const st=document.getElementById('stage');st.style.aspectRatio=w+'/'+h;st.style.maxWidth='min(100%, calc((100dvh - 150px) * '+(w/h).toFixed(4)+'))';}
function drawRoom(){rctx.clearRect(0,0,SW,SH);if(!roomImg)return;
  if(S.mode==='myroom'){const ir=roomImg.width/roomImg.height,cr=SW/SH;let w,h;if(ir>cr){h=SH;w=h*ir;}else{w=SW;h=w/ir;}rctx.drawImage(roomImg,(SW-w)/2,(SH-h)/2,w,h);}
  else rctx.drawImage(roomImg,0,0,SW,SH);}
function loadImage(src,cross){return new Promise((res,rej)=>{const im=new Image();if(cross)im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
async function loadScene(key){const sc=SCENES[key];setSize(sc.w,sc.h);roomImg=await loadImage(sc.bg,false);drawRoom();}

/* ---- rug load + auto-crop ---- */
function autoCrop(img){const w=220,h=Math.round(w*img.height/img.width);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);let d;try{d=x.getImageData(0,0,w,h).data;}catch(e){return[0,0,1,1];}
  const isRug=(i)=>{const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);return!(r>236&&g>236&&b>236&&(mx-mn)<16);};
  let minX=w,minY=h,maxX=0,maxY=0;const need=Math.max(2,Math.round(w*0.02));
  for(let yy=0;yy<h;yy++){let cnt=0;for(let xx=0;xx<w;xx++){if(isRug((yy*w+xx)*4)){cnt++;if(xx<minX)minX=xx;if(xx>maxX)maxX=xx;}}if(cnt>=need){if(yy<minY)minY=yy;if(yy>maxY)maxY=yy;}}
  if(maxX<=minX||maxY<=minY)return[0,0,1,1];const p=1;minX=Math.max(0,minX-p);minY=Math.max(0,minY-p);maxX=Math.min(w-1,maxX+p);maxY=Math.min(h-1,maxY+p);
  return[minX/w,minY/h,(maxX+1)/w,(maxY+1)/h];}
async function setRug(img,code){S.rug.img=img;S.rug.code=code;S.rug.crop=autoCrop(img);uploadRugTex(img);document.getElementById('rugCode').textContent=code;render();}
function showLoading(on,txt){const l=document.getElementById('loading');l.classList.toggle('hide',!on);if(txt)l.lastChild.textContent=txt;}
async function loadSku(sku){sku=(sku||'').trim().toUpperCase();if(!sku)return;const err=document.getElementById('skuErr');err.classList.remove('show');showLoading(true,'Loading '+sku+'…');
  try{const r=await fetch(CONFIG.searchApi(sku));const j=await r.json();const hit=(j.data||[]).find(d=>d.type==='product')||(j.data||[])[0];if(!hit||!hit.image)throw 0;
    let img;try{img=await loadImage(CONFIG.proxy(hit.image),true);}catch(e){img=await loadImage(hit.image,true);}
    await setRug(img,hit.name||sku);showLoading(false);return true;
  }catch(e){showLoading(false);err.textContent='Could not load "'+sku+'". Check the design number and try again.';err.classList.add('show');return false;}}

/* ---- interaction ---- */
const stage=document.getElementById('stage'),handlesEl=document.getElementById('handles');
function toNat(ev){const r=stage.getBoundingClientRect();return[(ev.clientX-r.left)/r.width*SW,(ev.clientY-r.top)/r.height*SH];}
function placeHandles(quad){handlesEl.innerHTML='';
  if(S.mode==='myroom'){quad.forEach((p,i)=>addHandle(p[0],p[1],'corner'+i));}
  else{const mid=[(quad[0][0]+quad[1][0])/2,(quad[0][1]+quad[1][1])/2],c=centroid(quad);const dir=[mid[0]-c[0],mid[1]-c[1]],len=Math.hypot(dir[0],dir[1])||1;addHandle(mid[0]+dir[0]/len*36,mid[1]+dir[1]/len*36,'rot',true);}}
function addHandle(x,y,id,isRot){const h=document.createElement('div');h.className='handle'+(isRot?' rot':'');h.style.left=(x/SW*100)+'%';h.style.top=(y/SH*100)+'%';h.dataset.id=id;handlesEl.appendChild(h);}
let drag=null;
function pointInQuad(px,py,q){let s=false;for(let i=0,j=3;i<4;j=i++){const xi=q[i][0],yi=q[i][1],xj=q[j][0],yj=q[j][1];if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))s=!s;}return s;}
stage.addEventListener('pointerdown',ev=>{const hid=ev.target.dataset&&ev.target.dataset.id;const[nx,ny]=toNat(ev);stage.setPointerCapture(ev.pointerId);
  if(hid&&hid.startsWith('corner'))drag={type:'corner',idx:+hid.slice(6)};
  else if(hid==='rot')drag={type:'rot'};
  else{if(pointInQuad(nx,ny,currentQuad())){drag={type:'move',sx:nx,sy:ny};stage.classList.add('dragging');}else return;}
  ev.preventDefault();});
stage.addEventListener('pointermove',ev=>{if(!drag)return;const[nx,ny]=toNat(ev);
  if(S.mode==='myroom'){const q=S.corners;if(drag.type==='corner')q[drag.idx]=[clamp(nx,0,SW),clamp(ny,0,SH)];else if(drag.type==='move'){const dx=nx-drag.sx,dy=ny-drag.sy;drag.sx=nx;drag.sy=ny;q.forEach(p=>{p[0]+=dx;p[1]+=dy;});}render();}
  else{if(drag.type==='move'){S.dx+=nx-drag.sx;S.dy+=ny-drag.sy;drag.sx=nx;drag.sy=ny;}
    else if(drag.type==='rot'){const c=centroid(SCENES[S.sceneKey].rugQuad.map(p=>[p[0]+S.dx,p[1]+S.dy]));const d=Math.atan2(ny-c[1],nx-c[0]);S.rotDeg=clamp(d*180/Math.PI+90,-30,30);document.getElementById('rot').value=Math.round(S.rotDeg);}
    render();}});
function endDrag(ev){if(drag){drag=null;stage.classList.remove('dragging');try{stage.releasePointerCapture(ev.pointerId)}catch(e){}}}
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ---- UI ---- */
function buildScenes(){const el=document.getElementById('scenes');el.innerHTML='';
  Object.keys(SCENES).forEach(k=>{const sc=SCENES[k];const d=document.createElement('div');d.className='scene'+(S.sceneKey===k&&S.mode==='photo'?' sel':'');d.innerHTML=`<img src="${sc.bg}" alt="${sc.label}"/><div class="lbl">${sc.label}</div>`;d.onclick=()=>selectScene(k);el.appendChild(d);});
  const m=document.createElement('div');m.className='scene myroom'+(S.mode==='myroom'?' sel':'');m.innerHTML=S.myRoomURL?`<img src="${S.myRoomURL}" alt="My Room"/><div class="lbl">My Room</div>`:`<div class="ic">⬆</div><small>My Room</small>`;m.onclick=()=>document.getElementById('fileIn').click();el.appendChild(m);}
async function selectScene(k){S.sceneKey=k;S.mode='photo';S.rotDeg=0;S.dx=0;S.dy=0;document.getElementById('rot').value=0;await loadScene(k);document.getElementById('rotSect').style.display='';document.getElementById('hint').firstChild.textContent='Drag the rug to move it · drag the gold dot to rotate';buildScenes();render();}
async function useMyRoom(url){S.myRoomURL=url;S.mode='myroom';const im=await loadImage(url,false);setSize(1280,Math.round(1280*im.height/im.width));roomImg=im;drawRoom();S.corners=[[SW*0.30,SH*0.46],[SW*0.70,SH*0.46],[SW*0.86,SH*0.86],[SW*0.14,SH*0.86]];document.getElementById('rotSect').style.display='none';document.getElementById('hint').firstChild.textContent='Drag the 4 dots onto your floor';buildScenes();render();}
const fileIn=document.createElement('input');fileIn.type='file';fileIn.accept='image/*';fileIn.id='fileIn';fileIn.style.display='none';fileIn.onchange=e=>{const f=e.target.files[0];if(f)useMyRoom(URL.createObjectURL(f));};document.body.appendChild(fileIn);
document.getElementById('rot').addEventListener('input',e=>{S.rotDeg=+e.target.value;render();});
document.getElementById('resetBtn').onclick=()=>{if(S.mode==='myroom')useMyRoom(S.myRoomURL);else selectScene(S.sceneKey);};
document.getElementById('skuGo').onclick=()=>loadSku(document.getElementById('skuInput').value);
document.getElementById('skuInput').addEventListener('keydown',e=>{if(e.key==='Enter')loadSku(e.target.value);});
document.getElementById('dlBtn').onclick=()=>{const out=document.createElement('canvas');out.width=SW;out.height=SH;const o=out.getContext('2d');o.drawImage(rc,0,0);o.drawImage(document.getElementById('glCanvas'),0,0);let url;try{url=out.toDataURL('image/jpeg',0.92);}catch(e){alert('Download blocked: rug image served without cross-origin permission. On kalaty.com (same-origin) this works.');return;}const a=document.createElement('a');a.href=url;a.download='Kalaty-'+S.rug.code+'-RoomView.jpg';a.click();};

/* ---- boot ---- */
async function boot(){buildScenes();await selectScene('aa895');const params=new URLSearchParams(location.search);const sku=(params.get('sku')||params.get('design')||CONFIG.defaultSku).toUpperCase();document.getElementById('skuInput').value=sku;const ok=await loadSku(sku);
  if(!ok&&sku===CONFIG.defaultSku){showLoading(true,'Loading demo rug…');try{const img=await loadImage(FALLBACK_AF1284,false);await setRug(img,'AF1284');}catch(e){}showLoading(false);document.getElementById('skuErr').classList.remove('show');}}
boot();
</script>
